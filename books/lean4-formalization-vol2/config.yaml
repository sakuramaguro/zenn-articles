title: "Lean 4で学ぶ位相・関数解析と不動点定理【第2巻】"
summary: |
  「Lean 4で始める数学の形式化」シリーズの第2巻。合本のPart 2（第6〜11章）と同じ内容です。
  Filter・nhdsから距離空間・位相・完備性・ℓ²へ進み、MathlibのBanach不動点定理を適用します。
  非空な完備距離空間上での不動点の一意存在と反復列の収束を確認し、具体的な不動点の値も求めます。
  固定環境で確認したコード、章末問題24問と解答を収録。序文・第6章・第7章は無料です。
