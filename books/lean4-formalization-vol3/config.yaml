title: "Lean 4で学ぶ測度・積分と確率空間【第3巻】"
summary: |
  「Lean 4で始める数学の形式化」シリーズの第3巻。合本用原稿のPart 3（第12〜18章）と同じ内容です。
  σ-代数・測度・可測関数から単関数とLebesgue積分へ進み、Mathlibの単調収束・Fatou・優収束の定理を適用します。
  Lᵖ空間、確率測度、期待値、条件付き期待値とマルチンゲールの基本的な性質を確認します。
  固定環境で確認したコード、章末問題21問と解答を収録。序文・第12章・第13章は無料です。
