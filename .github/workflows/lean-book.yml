name: Lean book

on:
  pull_request:
    paths:
      - 'books/lean4-formalization/**'
      - 'books/lean4-formalization-vol3/**'
      - 'images/**'
      - 'lean/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/lean-book.yml'
  push:
    branches: [main]
    paths:
      - 'books/lean4-formalization/**'
      - 'books/lean4-formalization-vol3/**'
      - 'images/**'
      - 'lean/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/lean-book.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Check manuscript and every formula
        run: |
          npm ci
          npm test
          python3 lean/scripts/catalog.py check
      - name: Install pinned Lean and Mathlib dependencies
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Build, audit axioms and check all source examples
        working-directory: lean
        run: python3 scripts/verify_all.py
      - name: Save verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-book-verification
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            lean/.generated/*.json
            lean/.generated/logs/
            lean/.generated/book-display/report.json
            lean/.generated/volume3-display/report.json
